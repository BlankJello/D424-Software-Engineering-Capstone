<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>View Employees</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #f2f2f2; }
        a { text-decoration: none; color: #007bff; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<h1>Employees List</h1>
<a href="/">Back to Home</a> | <a href="/employees/new">Add New Employee</a>

<div class="search-container">
    <form th:action="@{/employees}" method="get">
        <input type="text" name="keyword" placeholder="Search employees..." class="search-input"
               th:value="${keyword}" />
        <button type="submit" class="search-button">Search</button>
        <a th:href="@{/employees}" style="margin-left:10px;">Clear</a>
    </form>
</div>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Email</th>
        <th>position</th>
        <th>hire Date</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="employee : ${employees}">
        <td th:text="${employee.id != null ? employee.id : 'null'}">1</td>
        <td th:text="${employee.firstName}">John</td>
        <td th:text="${employee.lastName}">Doe</td>
        <td th:text="${employee.email}">johndoe@email.com</td>
        <td th:text="${employee.position}">Developer</td>
        <td th:text="${employee.hireDate}">Date</td>
        <td>
            <!-- Add a null check in the template to disable or hide Edit link if ID is null -->
            <a th:if="${employee.id != null}" th:href="@{'/employees/edit/' + ${employee.id}}">Edit</a>
            <a th:href="@{'/employees/delete/' + ${employee.id}}"
               onclick="return confirm('Are you sure you want to delete this employee?');">Delete</a>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(employees)}">
        <td colspan="3">No employees found.</td>
    </tr>
    </tbody>
</table>
</body>
</html>
