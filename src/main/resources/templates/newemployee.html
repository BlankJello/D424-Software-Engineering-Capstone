<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Add New Employee</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        form { max-width: 400px; }
        label { display: block; margin-top: 15px; }
        input[type="text"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        button {
            margin-top: 20px;
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover {
            background-color: #0056b3;
        }
        a { text-decoration: none; color: #007bff; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<h1>Add New Employee</h1>
<a href="/employees">Back to Employees List</a>
<form action="#" th:action="@{/employees}" method="post" th:object="${employee}">

    <label for="id">id:</label>
    <p><input type="text" id="id" th:field="*{id}" placeholder="Enter employee id" class="form-control mb-4 col-4" /></p>

    <label for="firstName">First Name:</label>
    <label for="lastName">Last Name:</label>
   <p><input type="text" id="firstName" th:field="*{firstName}" placeholder="Enter employee first name" class="form-control mb-4 col-4" /></p>
   <p><input type="text" id="lastName" th:field="*{lastName}" placeholder="Enter employee last name" class="form-control mb-4 col-4" /></p>

    <label for="hireDate">hireDate:</label>
    <p><input type="text" id="hireDate" th:field="*{hireDate}" placeholder="Enter employee hireDate" class="form-control mb-4 col-4" /></p>

    <label for="email">Email:</label>
    <p><input type="text" id="email" th:field="*{email}" placeholder="Enter employee email" class="form-control mb-4 col-4" /></p>

    <label for="position">Position:</label>
    <p><input type="text" id="position" th:field="*{position}" placeholder="Enter employee position" class="form-control mb-4 col-4" /></p>

    <p><input type="submit" value="Submit" /></p>
</form>
</body>
</html>
