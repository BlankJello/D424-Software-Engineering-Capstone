<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Edit Employee</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        form { max-width: 400px; }
        label { display: block; margin-top: 15px; }
        input[type="text"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        .error {
            color: red;
            font-size: 0.9em;
        }
        button {
            margin-top: 20px;
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover {
            background-color: #0056b3;
        }
        a { text-decoration: none; color: #007bff; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<h1>Edit Employee</h1>
<a href="/employees">Back to Employees List</a>
<form th:action="@{'/employees/edit/' + ${employee.id}}" th:object="${employee}" method="post">

    <label for="firstName">First Name:</label>
    <p>
        <input type="text" id="firstName" th:field="*{firstName}" placeholder="Enter employee first name" />
        <span class="error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></span>
    </p>

    <label for="lastName">Last Name:</label>
    <p>
        <input type="text" id="lastName" th:field="*{lastName}" placeholder="Enter employee last name" />
        <span class="error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></span>
    </p>

    <label for="email">Email:</label>
    <p>
        <input type="text" id="email" th:field="*{email}" placeholder="Enter employee email" />
        <span class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
    </p>

    <label for="position">Position:</label>
    <p>
        <input type="text" id="position" th:field="*{position}" placeholder="Enter employee position" />
        <span class="error" th:if="${#fields.hasErrors('position')}" th:errors="*{position}"></span>
    </p>

    <label for="hireDate">Hire Date yyyy-mm-dd:</label>
    <p>
        <input type="text" id="hireDate" th:field="*{hireDate}" placeholder="Enter employee hireDate" />
        <span class="error" th:if="${#fields.hasErrors('hireDate')}" th:errors="*{hireDate}"></span>
    </p>

    <p><button type="submit">Update</button></p>
</form>
</body>
</html>
